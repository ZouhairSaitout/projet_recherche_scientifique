name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rapport

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Tectonic
        uses: wtfjoke/setup-tectonic@v4

      - name: Compile the report
        run: tectonic -X compile main.tex

      - name: Upload the PDF
        uses: actions/upload-artifact@v7
        with:
          name: report
          path: rapport/main.pdf

  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint Markdown with markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

      # Offline mode checks the links to repository files, the heading anchors
      # and the images without depending on the availability of external sites.
      - name: Check links, anchors and images with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress .
          jobSummary: true
